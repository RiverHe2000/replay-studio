[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-studio"
version = "0.1.0"
description = "Evidence-grounded video search and editable clips with recoverable media processing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4", "boto3>=1.35,<2",
  "numpy>=2.2,<2.3", "Pillow>=11,<13", "python-multipart>=0.0.20",
]

[project.optional-dependencies]
models = ["faster-whisper>=1.1,<2", "rapidocr>=3,<4", "onnxruntime>=1.20,<2", "opencv-python>=4.10,<4.12", "torch==2.11.0", "torchvision==0.26.0", "transformers==5.16.1", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.12,<1", "playwright>=1.49,<2"]

[project.scripts]
replay = "replay_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: downloads or runs real neural models", "integration: actual media or external services"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
